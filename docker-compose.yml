version: "3"

services:

  backend:

    build: ./backend

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      - MONGO_URI=mongodb://127.0.0.1:27017/eventhive
      - JWT_SECRET=eventhive_secret

  frontend:

    build: ./frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend